name: Build & Release OmniLock

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (app)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust cache (service)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: service

      - name: Install dependencies
        run: npm ci

      - name: Build service daemon
        shell: bash
        run: |
          cargo build --release --manifest-path service/Cargo.toml
          mkdir -p src-tauri/resources
          # cp -f overwrites the committed resource binaries (PowerShell's copy
          # refuses to overwrite existing files, which broke every previous run).
          cp -f service/target/release/omnilock-svc.exe src-tauri/resources/
          cp -f service/target/release/omnilock-monitor.exe src-tauri/resources/

      - name: Build & Release (tagged push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OmniLock ${{ github.ref_name }}"
          releaseBody: |
            ## What's new
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Installation
            Download `OmniLock_*_x64-setup.exe` below and run it.
            The `.sig` file contains the update signature for auto-updater verification.
          releaseDraft: false
          prerelease: false

      - name: Build only (non-tagged push / workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmniLock-installer
          path: src-tauri/target/release/bundle/nsis/OmniLock_*_x64-setup.exe
