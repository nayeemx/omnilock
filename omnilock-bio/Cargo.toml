[package]
name = "omnilock-bio"
version = "0.1.0"
edition = "2021"
description = "Direct Synaptics VFS7552 (138a:00ab) fingerprint driver — Rust port of python-validity (GPL-3.0)"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Usb",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
rand = "0.8"

[profile.release]
lto = true
strip = true