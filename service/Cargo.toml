[package]
name = "omnilock-svc"
version = "0.0.22"
authors = ["InnologyBD <support@innologybd.com>"]
edition = "2021"
description = "OmniLock Service - ACL enforcement daemon"

[[bin]]
name = "omnilock-svc"
path = "src/bin/svc.rs"

[[bin]]
name = "omnilock-monitor"
path = "src/bin/monitor.rs"

[dependencies]
omnilock-shared = { path = "../shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-service = "0.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
sha2 = "0.10"
base64 = "0.21"
argon2 = "0.5"
aes-gcm = "0.10"
